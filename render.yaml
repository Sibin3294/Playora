# Playora — Render Blueprint (API + Admin)
# Apply via: https://dashboard.render.com/blueprint/new?repo=<YOUR_REPO_HTTPS_URL>
#
# Required secrets (set in Dashboard when prompted):
#   MONGODB_URI, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_JWT_SECRET

services:
  - type: web
    name: playora-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev so TypeScript (devDependency) is available during build
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true

  - type: web
    name: playora-admin
    runtime: static
    buildCommand: |
      set -e
      git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
      export PATH="$PATH:$HOME/flutter/bin"
      flutter config --no-analytics --enable-web
      cd admin
      flutter pub get
      flutter build web --release --dart-define=API_BASE=https://$PLAYORA_API_HOST
    staticPublishPath: admin/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PLAYORA_API_HOST
        fromService:
          name: playora-api
          type: web
          property: host
